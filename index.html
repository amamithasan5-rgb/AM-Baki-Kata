<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AM Baki Kata</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#f1f5f9;padding:14px}
.top{background:#0f766e;color:#fff;padding:18px;border-radius:16px}
.top h1{margin:0;font-size:24px}.top p{margin:6px 0 0;opacity:.9}
.card{background:#fff;padding:14px;border-radius:14px;margin-top:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{width:100%;padding:13px;border:0;border-radius:10px;background:#0f766e;color:#fff;font-size:16px;font-weight:700}
.item{display:flex;justify-content:space-between;align-items:center;background:#f8fafc;padding:12px;border-radius:10px;margin-top:8px}
.item b{font-size:17px}.item small{color:#64748b}
.del{background:#ef4444;padding:8px 12px;width:auto}
.total{font-size:20px;font-weight:800;text-align:center}
</style>
</head>
<body>
<div class="top"><h1>AM Baki Kata</h1><p>দোকানের বাকির হিসাব</p></div>
<div class="card"><p class="total">মোট বাকি: ৳ <span id="total">0</span></p></div>
<div class="card">
<input id="name" placeholder="কাস্টমারের নাম লিখুন">
<input id="amount" type="number" placeholder="টাকার পরিমাণ">
<button onclick="add()">+ বাকি যোগ করুন</button>
</div>
<div class="card" id="list"><p>এখনো কোনো বাকি নাই</p></div>
<script>
let data = JSON.parse(localStorage.getItem('baki')||'[]');
function show(){
  let t=0; let h='';
  data.forEach((d,i)=>{ t+=Number(d.amount); h+=`<div class="item"><div><b>${d.name}</b><br><small>৳ ${d.amount}</small></div><button class="del" onclick="del(${i})">মুছুন</button></div>` });
  document.getElementById('list').innerHTML = h || '<p>এখনো কোনো বাকি নাই</p>';
  document.getElementById('total').innerText = t;
}
function add(){
  let n=document.getElementById('name').value;
  let a=document.getElementById('amount').value;
  if(!n||!a) return alert('নাম আর টাকা দিন');
  data.push({name:n,amount:a});
  localStorage.setItem('baki',JSON.stringify(data));
  document.getElementById('name').value=''; document.getElementById('amount').value='';
  show();
}
function del(i){ data.splice(i,1); localStorage.setItem('baki',JSON.stringify(data)); show(); }
show();
</script>
</body>
</html>
